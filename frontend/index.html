<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GST Billing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f3fe0" />
    <meta name="description" content="Create GST-compliant invoices in under 2 minutes. Automatic CGST, SGST & IGST, PDF invoices, payment tracking. Free to start." />
    <meta name="robots" content="index, follow" />
    <!-- No static canonical tag here: a bare href="/" breaks Vite's asset resolver (reads the
         root as a file). src/lib/seo.ts sets a correct, absolute canonical per page at runtime,
         and scripts/prerender.py captures that into each static snapshot. -->
    <title>GST Billing by Tech Cognixium</title>

    <!-- Open Graph / Twitter - static defaults for crawlers that don't run JS.
         Per-page values are set at runtime by src/lib/seo.ts and are what scripts/prerender.py
         captures into the static snapshots of the marketing routes. -->
    <meta property="og:site_name" content="GST Billing by Tech Cognixium" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GST Billing by Tech Cognixium" />
    <meta property="og:description" content="Create GST-compliant invoices in under 2 minutes. Automatic CGST, SGST & IGST, PDF invoices, payment tracking. Free to start." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GST Billing by Tech Cognixium" />
    <meta name="twitter:description" content="Create GST-compliant invoices in under 2 minutes. Automatic CGST, SGST & IGST, PDF invoices, payment tracking. Free to start." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (no flash). "js" shows the loader below and hides the
      // crawler text (common/seo.py) for anyone whose browser is about to start the app.
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('gst-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* Shown until React mounts and replaces #root - a plain brand loader, never unstyled text. */
      #boot { display: none; position: fixed; inset: 0; place-items: center; background: #f6f5fc; }
      .js #boot { display: grid; }
      .dark #boot { background: #100e22; }
      #boot div { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #ddd8ff; border-top-color: #4f3fe0; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .js #seo-static { display: none; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading GST Billing"><div><img src="/favicon.svg" width="56" height="56" alt="" /><i></i></div></div><!--seo--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
